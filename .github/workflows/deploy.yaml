name: CI
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build-linux:
    runs-on: ["self-hosted", "linux", "large"]
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v7
      - name: Setup Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build
        run: make build -j$(nproc)
      - name: Test
        run: make test
      - name: Test (Deflake)
        run: make test-deflake
      - name: Zip binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cd bin/go && zip -qr9 ../../linux-build-bin.zip . -x 'windows_*' -x 'windows_*/*'
      - name: Upload binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-bin
          retention-days: 1
          path: linux-build-bin.zip
  build-windows-root:
    runs-on: ["self-hosted", "windows", "root"]
    steps:
      - name: Service Status
        run: |
          Get-Service actions.runner.* | Select-Object Name, Status
      - name: Verify administrator privileges
        run: |
          $identity  = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdmin   = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Running as: $($identity.Name)"
          Write-Host "Elevated:   $isAdmin"
          if (-not $isAdmin) {
            Write-Error "This job is not running with administrator privileges."
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Test Assets
        run: make testassets archiveassets
      - name: Test
        run: make test
  build-windows:
    runs-on: ["self-hosted", "windows"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Test Assets
        run: make testassets archiveassets
      - name: Build
        run: make all -j8
      - name: Test
        run: make test
      - name: Test (Race Test)
        run: make GO_TEST_COUNT=5 test-deflake
      - name: Zip binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd bin/go
          zip -qr9 ../../windows-build-bin.zip windows_*
      - name: Upload binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-bin
          retention-days: 1
          path: windows-build-bin.zip
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-linux, build-windows]
    runs-on: ["self-hosted", "linux"]
    permissions:
      actions: write
    steps:
      - name: Download Linux binaries
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-build-bin
      - name: Download Windows binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-build-bin
      - name: Extract binaries
        run: |
          mkdir -p bin/go
          unzip -oq linux-build-bin.zip -d bin/go
          unzip -oq windows-build-bin.zip -d bin/go
      - name: Zip binaries
        run: cd bin/go && zip -qr9 ../../ufs-binaries.zip .
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ufs-binaries
          path: ufs-binaries.zip
      - name: Delete intermediate artifacts
        # https://github.com/GeekyEggo/delete-artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            linux-build-bin
            windows-build-bin
