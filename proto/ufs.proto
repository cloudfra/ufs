edition = "2024";

package cloudfra.ufs;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/go_features.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cloudfra/ufs/proto";

// grpc-gateway's generated code accesses request fields directly (the
// classic Go struct API) rather than through opaque-API accessors, which
// edition 2024 defaults to.
option features.(pb.go).api_level = API_OPEN;

// Match proto3's implicit field presence (plain value types instead of
// pointers), which is what grpc-gateway's generated code expects.
option features.field_presence = IMPLICIT;

// FilePermissions captures the access and type flags of a single node in a
// backend-agnostic form, so a client need not know which OS the backend uses.
// It tracks individual flags rather than any one OS's permission scheme: a
// backend that does not report a flag simply leaves it unset.
message FilePermissions {
  // The file can be read.
  bool read = 1;

  // The file can be written.
  bool write = 2;

  // The file can be executed.
  bool execute = 3;

  // The entry is a directory.
  bool dir = 4;

  // The entry is a symbolic link rather than a regular file or directory.
  bool symlink = 5;

  // Group flag. Semantics are defined by the providing backend.
  bool group = 6;
}

// FileAttributes is a per-node metadata record whose `name` references the
// [File] resource. Beyond that reference it carries the node's identity (uid),
// its descriptive attributes (absolute path, size, access/type flags), and its
// lifecycle timestamps.
message FileAttributes {
  // The [File] resource this record describes, by its name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // The node's absolute, OS-level path as known by the backend. Empty for
  // backends with no native absolute path (e.g. object storage).
  string absolute_path = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Length in bytes for regular files; system-dependent for others.
  int64 size = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The access and type flags for the node, see [FilePermissions].
  FilePermissions permission = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation time, as reported by backends that track it (e.g. NTFS). AIP-148
  // standard field; empty if the backend does not provide a creation time.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The time the node was last modified, as returned by [fs.FileInfo.ModTime]
  // (the standard AIP-148 `update_time` field). Empty if the backend does not
  // report one.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last access time, as reported by backends that track it (a file-system
  // concept, not an AIP-148 standard field).
  google.protobuf.Timestamp access_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A stable, system-assigned unique identifier for the node (e.g. the inode
  // number or a backend object ID), per AIP-148. Empty for backends that have
  // no such identifier.
  string uid = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// File is the resource representation of a node (regular file or directory)
// in a [types.ReadFS] tree. It mirrors [types.FileInfo].
//
// File names follow [fs.ValidPath]: forward-slash separated, no leading
// slash, no "." or ".." components. The root directory is always ".".
message File {
  option (google.api.resource) = {
    type: "ufs.cloudfra.io/File"
    pattern: "{path=**}"
    singular: "file"
    plural: "files"
  };

  // The path of the file, relative to the root of the file system.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Length in bytes for regular files; system-dependent for others.
  int64 size = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // File mode bits, as defined by Go's io/fs.FileMode.
  uint32 mode = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The time the file was last modified.
  google.protobuf.Timestamp mod_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the file is a directory. Equivalent to mode's directory bit.
  bool is_dir = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// FileSystemInfo is the metadata a file system reports about itself: what the
// file system is, not what one path inside it is. [GetMetadata] is the only rpc
// that returns it and returns every field in one answer: these facets are
// separate Go methods but one network read each, so the rpc answers all of them
// at once and a client reads this message once and caches it instead of paying a
// round trip per facet. A file system that does not implement the Go interface
// behind a field leaves that field at its zero value.
//
// It is still the singleton resource of AIP-156 that it was: there is exactly
// one per file system, it has no name field, and no field below changes from
// path to path. What a file system answers per path does not belong here,
// because a client wants those where it is working on the path rather than once
// for the file system.
message FileSystemInfo {
  // The URI that identifies this file system, as [types.URIGet.URI] reports it,
  // the method [types.URIGetFS] carries as well. Can be passed to ufs.New to
  // reconstruct an equivalent file system. Empty if the file system has no
  // meaningful URI.
  string uri = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A human-readable description of how the file system is composed, as
  // [fmt.Stringer.String] reports it — the method that [types.ReadFS] and
  // [types.StringerFS] both carry. Intended for debugging and logging, not
  // programmatic use.
  string description = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Which device backs which path, as [types.DeviceInfoGet.DeviceInfo] reports
  // it, the method [types.DeviceInfoGetFS] carries as well: the [types.DeviceMap]
  // keyed by path, with "." for the root. The map is minimal, naming a path only
  // where the backing device changes, and a path with no entry of its own is
  // backed by the entry of its nearest ancestor, which is the lookup
  // [types.DeviceMap.Backing] performs. The map covers the whole file system in
  // one answer, which is why it is here rather than being asked per path.
  map<string, DeviceInfo> devices = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// BoltFileRecord is the value the bolt driver (drivers/boltfs) stores under
// each file's key in its backing bbolt database. The node's path is not part
// of the record: it is implied by the bbolt key (and the chain of nested
// buckets leading to it). BoltFileRecord is internal to that driver and is
// not part of the RPC surface.
message BoltFileRecord {
  // File mode bits, as defined by Go's io/fs.FileMode.
  uint32 mode = 1;

  // The time the file was last modified.
  google.protobuf.Timestamp mod_time = 2;

  // Raw file content.
  bytes content = 3;
}

// SymlinkHandling controls whether a lookup follows a symbolic link to its
// target or reports on the link itself.
enum SymlinkHandling {
  // Equivalent to SYMLINK_HANDLING_FOLLOW.
  SYMLINK_HANDLING_UNSPECIFIED = 0;

  // Follow the symbolic link and describe its target. Equivalent to
  // [types.ReadFS.Stat] / [fs.Stat].
  SYMLINK_HANDLING_FOLLOW = 1;

  // Do not follow the symbolic link; describe the link itself. Equivalent to
  // [fs.ReadLinkFS.Lstat].
  SYMLINK_HANDLING_NO_FOLLOW = 2;
}

message GetFileRequest {
  // The path of the file to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // Whether to follow a trailing symbolic link at name. Defaults to
  // SYMLINK_HANDLING_FOLLOW.
  SymlinkHandling symlink_handling = 2;
}

message ListFilesRequest {
  // The directory whose immediate children should be listed. "." lists the
  // root directory.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // The maximum number of files to return. The service may return fewer
  // than this value. If unspecified, the server picks a reasonable default.
  int32 page_size = 2;

  // A page token received from a previous ListFiles call, used to retrieve
  // the next page.
  string page_token = 3;
}

message ListFilesResponse {
  // The immediate children of the requested parent directory, sorted by
  // filename, as returned by [types.ReadFS.ReadDir].
  repeated File files = 1;

  // A token that can be sent as page_token to retrieve the next page. Empty
  // if there are no more files.
  string next_page_token = 2;
}

message ReadFileRequest {
  // The path of the file to read.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // The byte offset to start reading from. 0 reads from the start of the
  // file.
  int64 offset = 2;

  // The maximum number of bytes to return across the whole stream. 0 (the
  // default) reads to the end of the file.
  int64 limit = 3;
}

message ReadFileResponse {
  // A chunk of file content. Chunks are delivered in order starting at
  // offset and are concatenated by the client to reconstruct the requested
  // range.
  bytes data = 1;

  // How many bytes the whole stream will carry, set on the first frame only
  // and only when the server knows it, so that a client collecting the stream
  // can allocate once rather than grow a buffer frame by frame. 0 means
  // unknown, not empty. It is a hint: the content can change while it
  // streams, and the client still reads to the end of the stream.
  int64 size = 2;
}

message ReadLinkRequest {
  // The path of the symbolic link to resolve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];
}

message ReadLinkResponse {
  // The destination path of the symbolic link, as returned by
  // [types.ReadFS.ReadLink]. May be relative to the link's directory.
  string target = 1;
}

// GetMetadataRequest is empty: [GetMetadata] describes the file system rather
// than a path in it, so there is nothing to name.
message GetMetadataRequest {}

// DeviceInfo describes one backing device of a file system, mirroring
// [types.DeviceInfo]. It is platform-agnostic on purpose: a client need not
// know how the server's operating system names devices in order to decide how
// hard to drive it.
//
// The remote flag that [types.DeviceInfo] carries is deliberately not on the
// wire. A file system reports remoteness to itself, for the process that holds
// it; to a client of this service everything is already remote, so the field
// would answer the same question for every device and answer it before the
// client has made a single call. How much a device is worth driving is what
// device_type and thread_count are for.
message DeviceInfo {
  // The name of the device, as given by the operating system or by the ufs
  // implementation. "default" when the backing device is not known.
  string name = 1;

  // The kind of device behind a path (e.g. "disk", "tmpfs", or an
  // object-storage scheme). "unknown" when it cannot be reported.
  string device_type = 2;

  // The recommended number of concurrent accesses for the device; 1 is the
  // answer for a device that should not be walked in parallel.
  int32 thread_count = 3;
}

// WriteFileRequest is one frame of a [WriteFile] upload. name and mode are
// read from the first frame and ignored in the rest, which is what lets
// grpc-gateway proxy the call from one HTTP request body; data chunks arrive
// in order and are concatenated into the file's whole content. An empty stream
// writes an empty file.
message WriteFileRequest {
  // The path of the file to write.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // Permission bits for a file that is created, as defined by Go's
  // io/fs.FileMode. A file that already exists keeps the permissions it has.
  uint32 mode = 2;

  // Part of the file's content, in order.
  bytes data = 3;

  // The size of the whole upload, read from the first frame and only as a
  // hint: 0 means unknown. A server refuses an upload whose hint is already
  // above what it accepts before taking any more of it, and sizes the buffer
  // it joins the frames into once. The content is still what the frames
  // carry.
  int64 size = 4;
}

message MkdirAllRequest {
  // The path of the directory to create, together with any missing parents.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // Permission bits for newly created nodes, as defined by Go's
  // io/fs.FileMode.
  uint32 mode = 2;
}

message RemoveRequest {
  // The path of the file or empty directory to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];
}

message RemoveAllRequest {
  // The path to delete, together with everything below it.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];
}

message RenameRequest {
  // The path of the file or directory to move.
  string old_name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // Where to move it.
  string new_name = 2 [(google.api.field_behavior) = REQUIRED];
}

message MkdirRequest {
  // The path of the directory to create. Its parent must exist.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // Permission bits for the new directory, as defined by Go's io/fs.FileMode.
  uint32 mode = 2;
}

message ChmodRequest {
  // The path whose mode to change.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // The new mode, as defined by Go's io/fs.FileMode.
  uint32 mode = 2;
}

message ChownRequest {
  // The path whose owner to change.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // The numeric user and group ids. -1 leaves that id unchanged.
  int64 uid = 2;
  int64 gid = 3;

  // Whether a trailing symbolic link is followed ([types.ChownFS.Chown]) or
  // changed itself ([types.LchownFS.Lchown]). Defaults to
  // SYMLINK_HANDLING_FOLLOW.
  SymlinkHandling symlink_handling = 4;
}

message ChtimesRequest {
  // The path whose times to change.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // The new access and modification times. An unset time leaves that time
  // unchanged, as the zero time.Time does for [types.ChtimesFS.Chtimes].
  google.protobuf.Timestamp access_time = 2;
  google.protobuf.Timestamp modification_time = 3;
}

message SymlinkRequest {
  // What the link points at, stored as given.
  string target = 1 [(google.api.field_behavior) = REQUIRED];

  // The path of the link to create.
  string name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];
}

message LinkRequest {
  // The existing file to link to.
  string old_name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // The path of the new hard link.
  string new_name = 2 [(google.api.field_behavior) = REQUIRED];
}

message CopyFileRequest {
  // The file to copy.
  string source_name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];

  // Where to put the copy. It must not exist.
  string destination_name = 2 [(google.api.field_behavior) = REQUIRED];
}

message ClosestParentRequest {
  // The path to start from.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];
}

message ClosestParentResponse {
  // The closest node at or above the requested name that exists, the name
  // itself included.
  string name = 1;

  // Whether that node is a directory.
  bool is_dir = 2;
}

message WatchRequest {
  // The directory to watch, together with everything below it.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ufs.cloudfra.io/File" }
  ];
}

// NotifyOp is the kind of change a [WatchEvent] reports, as [types.NotifyOp].
enum NotifyOp {
  NOTIFY_OP_UNSPECIFIED = 0;
  NOTIFY_OP_CREATE = 1;
  NOTIFY_OP_WRITE = 2;
  NOTIFY_OP_REMOVE = 3;
  NOTIFY_OP_RENAME = 4;
  NOTIFY_OP_CHMOD = 5;
}

// WatchEvent is one change, as one call of a [types.NotifyHook].
message WatchEvent {
  NotifyOp op = 1;

  // The root-relative path that changed.
  string name = 2;
}

message WatchResponse {
  // The changes observed since the previous response, in order. The first
  // response of every stream is empty and says that the watch is in place:
  // a change made after the client has it is reported.
  repeated WatchEvent events = 1;
}

// FS exposes a ufs file system over RPC with the rpc surface of [types.FS]
// and of the optional interfaces of drivers/types that can cross a wire: the
// read surface of [types.ReadFS] — metadata lookup, directory listing, symbolic
// link resolution and streaming file content — whole-file upload, directory
// creation and deletion, rename, copy, mode, owner and time changes, symbolic
// and hard links, the closest existing parent of a path, a stream of changes,
// and one metadata read covering the file system itself.
//
// Each rpc maps one-to-one onto a Go method: the rpc name is the method name,
// the request message carries that method's arguments, the first argument is
// bound into the URL and the rest travel in the request body. The verbs
// (":readLink", ":mkdirAll", ":removeAll", ...) mirror the Go names instead of
// following an AIP-133 resource model, so the rpc-to-method mapping stays
// auditable line by line. A method whose Go signature returns only an error
// returns [google.protobuf.Empty]. A method several interfaces carry is
// exposed once, which is why there is one GetFile rather than one for
// [fs.StatFS] and one for [types.ReadFS], and one Chown whose
// symlink_handling chooses between [types.ChownFS] and [types.LchownFS].
//
// The rpc surface is the same whatever file system a server stands on. An rpc
// of an optional interface is answered the way drivers/polyfills answers the
// method in the server's own process: by the served file system's own method
// when it has one, by an emulation on the server when one keeps the method's
// contract (a rename or a copy moves content inside the server, never over
// the network), and otherwise with UNIMPLEMENTED, which a Go client reports
// as errors.ErrUnsupported. Watch has no emulation and is answered only by a
// file system that watches.
//
// The rule bends in one place, deliberately: [GetMetadata] answers three Go
// methods in one rpc. [types.URIGet.URI], [fmt.Stringer.String] and
// [types.DeviceInfoGet.DeviceInfo] are three cheap calls in Go that say the
// same thing about a file system whichever path they are asked about, so they
// are answered by one [FileSystemInfo] that a client reads once and caches.
// [types.CreateFileFS.Create] is the other way round: it takes nothing but a
// name and returns a live [types.File] handle, which is not a value that can
// cross the wire, so it has no rpc of its own and is answered by [WriteFile],
// which creates the file and carries its content in one request rather than
// two. [types.OpenFileFS.OpenFile] is answered the same way, by a client
// building the handle from [ReadFile] and [WriteFile].
//
// Errors follow the standard gRPC canonical codes: a path the file
// system does not hold returns NOT_FOUND (wrapping fs.ErrNotExist), a path
// that already exists where the call needs it not to returns ALREADY_EXISTS
// (wrapping fs.ErrExist), an operation the backend refuses returns
// PERMISSION_DENIED (wrapping fs.ErrPermission), a path that [fs.ValidPath]
// rejects returns INVALID_ARGUMENT (wrapping fs.ErrInvalid), and an operation
// the served file system cannot perform at all returns UNIMPLEMENTED
// (wrapping errors.ErrUnsupported).
//
// Some Go methods are deliberately not rpcs.
//
// [io.Closer.Close] and [types.ReleaseFS.Release] act on the entire underlying
// file system rather than on a single request, and a server cannot decide when
// every client it serves is done with the file system it was handed.
//
// [types.ComparableFS.IsSame] asks whether two file systems hold one set of
// data. All a client can name on the wire is a location, and ComparableFS
// states that it answers a different question from the one that compares
// locations. What a client can compare instead is the uri field of
// [GetMetadata].
//
// [types.BatchCreateFS.BatchCreate] promises all or none. Whether the served
// file system keeps that promise is not something a client can know when it
// is built, so a client writes a batch one file at a time, as ufs.BatchCreate
// does for any file system without the interface.
//
// [types.WrapperFS.InnerFS] hands back an [fs.FS] value rather than data,
// [types.MountedArchiveDirFS] describes how a file system lays out its own
// mounts, and [types.ExternalPathGetFS.ExternalPath] names a location a client
// already holds: it reaches the file system through a grpc:// address that
// names the server.
service FS {
  // GetFile returns metadata for the node at name. Equivalent to
  // [types.ReadFS.Stat], or [types.ReadFS.Lstat] when symlink_handling is
  // SYMLINK_HANDLING_NO_FOLLOW.
  rpc GetFile(GetFileRequest) returns (File) {
    option (google.api.http) = {
      get: "/v1/fs/{name=**}"
    };
  }

  // ListFiles returns the immediate children of a directory. Equivalent to
  // [types.ReadFS.ReadDir], which is [fs.ReadDirFS.ReadDir].
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option (google.api.http) = {
      get: "/v1/fs/files"
    };
  }

  // ReadFile streams the content of the file at name. Equivalent to
  // [types.ReadFS.ReadFile], or to [fs.FS.Open] followed by reading what the
  // handle gives. [fs.FS.Open] returns a handle rather than data, so this rpc
  // is how a reader reaches it; what a handle does once it is open — a position
  // that moves, a partial write, a seek — has no rpc here.
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse) {
    option (google.api.http) = {
      get: "/v1/fs/{name=**}:read"
    };
  }

  // ReadLink returns the destination of the symbolic link at name. Equivalent
  // to [types.ReadFS.ReadLink], which is [fs.ReadLinkFS.ReadLink].
  rpc ReadLink(ReadLinkRequest) returns (ReadLinkResponse) {
    option (google.api.http) = {
      get: "/v1/fs/{name=**}:readLink"
    };
  }

  // GetMetadata is the single metadata read about the file system itself: one
  // rpc answering what three Go methods report, in one [FileSystemInfo].
  //
  // Its uri, description and devices fields answer [types.URIGet.URI],
  // [fmt.Stringer.String] — which [types.ReadFS] and [types.StringerFS] both
  // carry — and [types.DeviceInfoGet.DeviceInfo]. None of the three is about a
  // path, which is why the request names none: one answer describes the whole
  // file system.
  //
  // One rpc rather than three because a method call in Go and a round trip are
  // not the same price: the answer is meant to be read once and cached by the
  // client, which is also why there is no field selector for asking a subset of
  // it. A file system that does not implement one of those interfaces leaves the
  // fields it would have filled at their zero values, and an error status is the
  // failure of the read as a whole.
  rpc GetMetadata(GetMetadataRequest) returns (FileSystemInfo) {
    option (google.api.http) = {
      get: "/v1/fs/fileSystemInfo"
    };
  }

  // WriteFile writes a whole file in one call, as [types.WriteFileFS.WriteFile]
  // does: the file is created if necessary and truncated first, and the
  // parents are not created. It is also how [types.CreateFileFS.Create] is
  // answered — see the service comment — so creating a file and filling it is
  // one request, and a reader never sees the empty file that creating it and
  // then writing it would expose.
  //
  // A single small upload is the common case. The 10 MB ceiling above which a
  // file is worth streaming rather than sending whole is a server policy, not
  // part of the wire format, so it is recorded here rather than as a field a
  // client could set: below it a client puts the content in one frame — one
  // HTTP request body — and above it the content arrives in the stream this rpc
  // is.
  //
  // The upload is a client stream so that a file larger than the server will
  // accept in one message still fits, and so that grpc-gateway can proxy the
  // call from an ordinary HTTP request body. The whole file is still one
  // request, which is what WriteFile is: no partial write and no seek.
  //
  // The URL names no path parameter, because a client-streaming rpc cannot
  // carry one: the path of the file travels in the first frame, so the HTTP
  // form is a POST whose whole body is the file.
  rpc WriteFile(stream WriteFileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/fs/files:writeFile"
      body: "*"
    };
  }

  // MkdirAll creates the directory at name and any missing parents, as
  // [types.MkdirAllFS.MkdirAll] does. It is a no-op if the directory exists.
  rpc MkdirAll(MkdirAllRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/fs/{name=**}:mkdirAll"
      body: "*"
    };
  }

  // Remove deletes the file or empty directory at name, as
  // [types.RemoveFS.Remove] does. A non-empty directory is an error; so is
  // removing the root.
  rpc Remove(RemoveRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/fs/{name=**}"
    };
  }

  // RemoveAll deletes name and everything below it, as
  // [types.RemoveAllFS.RemoveAll] does. A name that does not exist succeeds.
  rpc RemoveAll(RemoveAllRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/fs/{name=**}:removeAll"
    };
  }

  // Rename moves the file or directory at old_name to new_name, as
  // [types.RenameFS.Rename] does: through the served file system's own rename
  // when it has one, and otherwise by copying and removing on the server,
  // which never moves the content over the network.
  rpc Rename(RenameRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/fs/{old_name=**}:rename"
      body: "*"
    };
  }

  // Mkdir creates one directory whose parent exists, as [types.MkdirFS.Mkdir]
  // does.
  rpc Mkdir(MkdirRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/fs/{name=**}:mkdir"
      body: "*"
    };
  }

  // Chmod changes the mode of name, as [types.ChmodFS.Chmod] does.
  rpc Chmod(ChmodRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/fs/{name=**}:chmod"
      body: "*"
    };
  }

  // Chown changes the owner of name, as [types.ChownFS.Chown] does, or of a
  // symbolic link itself, as [types.LchownFS.Lchown] does.
  rpc Chown(ChownRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/fs/{name=**}:chown"
      body: "*"
    };
  }

  // Chtimes changes the access and modification times of name, as
  // [types.ChtimesFS.Chtimes] does.
  rpc Chtimes(ChtimesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/fs/{name=**}:chtimes"
      body: "*"
    };
  }

  // Symlink creates name as a symbolic link to target, as
  // [types.SymlinkFS.Symlink] does.
  rpc Symlink(SymlinkRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/fs/{name=**}:symlink"
      body: "*"
    };
  }

  // Link creates new_name as a hard link to old_name, as [types.LinkFS.Link]
  // does.
  rpc Link(LinkRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/fs/{old_name=**}:link"
      body: "*"
    };
  }

  // CopyFile copies source_name to destination_name on the server, as
  // [types.CopyFileFS.CopyFile] does, so the content never crosses the
  // network.
  rpc CopyFile(CopyFileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/fs/{source_name=**}:copy"
      body: "*"
    };
  }

  // ClosestParent returns the closest node at or above name that exists, as
  // [types.ClosestParentFS.ClosestParent] does, which is one round trip where
  // walking up with [GetFile] would be one per missing level.
  rpc ClosestParent(ClosestParentRequest) returns (ClosestParentResponse) {
    option (google.api.http) = {
      get: "/v1/fs/{name=**}:closestParent"
    };
  }

  // Watch streams the changes below the directory name, as
  // [types.Watcher.Watch] does, until the client cancels the call. The first
  // response is empty and says the watch is in place. Changes that arrive
  // while a response is being sent are batched into the next one, so a burst
  // of changes costs a few messages rather than one per change. A client that
  // falls so far behind that the server would have to hold an unbounded
  // backlog has the stream ended with RESOURCE_EXHAUSTED.
  rpc Watch(WatchRequest) returns (stream WatchResponse) {
    option (google.api.http) = {
      get: "/v1/fs/{name=**}:watch"
    };
  }
}
