edition = "2024";

package cloudfra.ufs;

import "google/protobuf/go_features.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cloudfra/ufs/proto";

// Match ufs.proto: the classic Go struct API rather than the opaque API.
option features.(pb.go).api_level = API_OPEN;

// Match ufs.proto: proto3's implicit field presence.
option features.field_presence = IMPLICIT;

// WriteLogEntry is one mutation recorded by a write log
// (drivers/common/writelog). Entries are replayed in order against another
// file system to reproduce the mutations. WriteLogEntry is not part of the
// RPC surface.
message WriteLogEntry {
  // Op is the kind of mutation.
  enum Op {
    // Unset. Never recorded.
    OP_UNSPECIFIED = 0;

    // Write the file's full content, creating missing parent directories.
    OP_PUT = 1;

    // Create the directory and any missing parents, like MkdirAll.
    OP_MKDIR = 2;

    // Remove the path and everything below it, like RemoveAll. Removing a
    // path that does not exist succeeds.
    OP_REMOVE_ALL = 3;
  }

  // The mutation.
  Op op = 1;

  // The fs.ValidPath name the mutation applies to.
  string name = 2;

  // File mode bits, as defined by Go's io/fs.FileMode.
  uint32 mode = 3;

  // The modification time of the file or directory after the mutation.
  google.protobuf.Timestamp mod_time = 4;

  // OP_PUT only: the content length in bytes.
  int64 size = 5;

  // OP_PUT only: the content. Empty until the payload is attached; a write
  // log may reference the payload in its source file system instead.
  bytes content = 6;
}
