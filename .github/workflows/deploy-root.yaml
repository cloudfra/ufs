name: CI Root

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-root:
    runs-on: ["self-hosted", "windows", "root"]
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Initialize CI
        shell: powershell
        run: ./scripts/Initialize-AdministratorCI.ps1
      - name: Build Assets
        run: make assets testassets
      - name: Download Dependencies
        run: make deps
      - name: Test
        run: make test
